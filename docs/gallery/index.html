<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <script src="https://cdn.jsdelivr.net/npm/diorama@1.0.1/dist/diorama.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a1a;
            font-family: Arial, sans-serif;
        }
        #gallery {
            position: relative;
        }
        #gallery img {
            position: absolute;
            object-fit: cover;
            cursor: pointer;
            transition: filter 0.2s;
        }
        #gallery img:hover {
            filter: brightness(1.1);
        }
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-size: 24px;
        }
        .error {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ff6b6b;
            font-size: 20px;
            text-align: center;
            padding: 20px;
        }
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            background: none;
            border: none;
        }
        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 60px;
            font-weight: bold;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.5);
            border: none;
            padding: 20px;
            user-select: none;
        }
        .lightbox-prev { left: 20px; }
        .lightbox-next { right: 20px; }
    </style>
</head>
<body>
    <div id="root"><div class="loading">Loading gallery...</div></div>

    <script>
        const GAP = 4;

        const urls = (() => {
            const params = new URLSearchParams(window.location.search);
            const urlsParam = params.get('urls');
            if (urlsParam) {
                return urlsParam.split(',').map(u => u.trim()).filter(Boolean);
            }
            return [
                'https://picsum.photos/id/1018/1200/800',
                'https://picsum.photos/id/1015/800/1200',
                'https://picsum.photos/id/1019/1000/800',
                'https://picsum.photos/id/1016/900/600',
                'https://picsum.photos/id/1020/1200/900',
                'https://picsum.photos/id/1025/800/1200',
                'https://picsum.photos/id/1011/1100/700',
                'https://picsum.photos/id/1012/800/800',
            ];
        })();

        // --- Lightbox ---
        let lightboxIndex = null;
        let lightboxEl = null;

        function openLightbox(index) {
            lightboxIndex = index;
            renderLightbox();
        }
        function closeLightbox() {
            lightboxIndex = null;
            if (lightboxEl) { lightboxEl.remove(); lightboxEl = null; }
        }
        function moveLightbox(delta) {
            lightboxIndex = (lightboxIndex + delta + urls.length) % urls.length;
            renderLightbox();
        }
        function renderLightbox() {
            if (lightboxEl) lightboxEl.remove();
            lightboxEl = document.createElement('div');
            lightboxEl.className = 'lightbox';
            lightboxEl.innerHTML = `
                <button class="lightbox-close">&times;</button>
                ${urls.length > 1 ? `
                    <button class="lightbox-nav lightbox-prev">&#8249;</button>
                    <button class="lightbox-nav lightbox-next">&#8250;</button>
                ` : ''}
                <img src="${urls[lightboxIndex]}" alt="Photo ${lightboxIndex + 1}" />
            `;
            lightboxEl.querySelector('.lightbox-close').onclick = closeLightbox;
            lightboxEl.querySelector('.lightbox-prev')?.addEventListener('click', e => { e.stopPropagation(); moveLightbox(-1); });
            lightboxEl.querySelector('.lightbox-next')?.addEventListener('click', e => { e.stopPropagation(); moveLightbox(1); });
            lightboxEl.onclick = closeLightbox;
            lightboxEl.querySelector('img').onclick = e => e.stopPropagation();
            document.body.appendChild(lightboxEl);
        }
        document.addEventListener('keydown', e => {
            if (lightboxIndex === null) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') moveLightbox(-1);
            if (e.key === 'ArrowRight') moveLightbox(1);
        });

        // --- Preload all images to get natural dimensions ---
        async function loadImages(urls) {
            return Promise.all(urls.map((url, i) => new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve({
                    url,
                    index: i,
                    aspectRatio: img.naturalWidth / img.naturalHeight,
                });
                img.onerror = () => reject(new Error(`Failed to load: ${url}`));
                img.src = url;
            })));
        }

        // --- Render gallery from diorama nodes ---
        function renderGallery(images, nodes) {
            const root = document.getElementById('root');
            root.innerHTML = '';

            const gallery = document.createElement('div');
            gallery.id = 'gallery';
            gallery.style.width = window.innerWidth + 'px';
            gallery.style.height = window.innerHeight + 'px';

            nodes.forEach(node => {
                if (node.dummy) return;
                const img = document.createElement('img');
                img.src = images[node.index].url;
                img.alt = `Photo ${node.index + 1}`;
                img.style.left   = (node.x      + GAP / 2) + 'px';
                img.style.top    = (node.y      + GAP / 2) + 'px';
                img.style.width  = (node.width  - GAP)     + 'px';
                img.style.height = (node.height - GAP)     + 'px';
                img.addEventListener('click', () => openLightbox(node.index));
                gallery.appendChild(img);
            });

            root.appendChild(gallery);
        }

        // --- Main ---
        async function init() {
            if (urls.length === 0) {
                document.getElementById('root').innerHTML = '<div class="error">No valid photo URLs found.</div>';
                return;
            }

            let images;
            try {
                images = await loadImages(urls);
            } catch (err) {
                document.getElementById('root').innerHTML = `<div class="error">${err.message}</div>`;
                return;
            }

            const aspectRatios = images.map(img => img.aspectRatio);

            function debounce(fn, delay) {
                let timer;
                return (...args) => {
                    clearTimeout(timer);
                    timer = setTimeout(() => fn(...args), delay);
                };
            }

            function layout() {
                const nodes = diorama.searchSolution(
                    window.innerWidth,
                    window.innerHeight,
                    aspectRatios,
                    300  // ms to search for a good solution
                );
                renderGallery(images, nodes);
            }

            layout();
            window.addEventListener('resize', debounce(layout, 150));
        }

        init();
    </script>
</body>
</html>
